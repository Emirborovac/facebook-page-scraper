<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media Ultimate Scraper — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:    #EC4899;
      --pink-dk: #BE185D;
      --black:   #0a0a0a;
      --white:   #ffffff;
      --gray:    #f4f4f6;
      --border:  #e0e0e8;
      --text:    #1a1a2e;
      --muted:   #6b6b80;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(236,72,153,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236,72,153,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.10) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
    }

    .login-header {
      background: var(--pink);
      padding: 36px 40px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .login-logo {
      width: 40px;
      height: 40px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .login-logo svg { display: block; }

    .login-header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.3px;
    }

    .login-header-text p {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      margin-top: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-body {
      padding: 40px 40px 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 44px;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      padding: 0 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--pink); }

    .login-btn {
      width: 100%;
      height: 46px;
      background: var(--pink);
      color: var(--white);
      border: none;
      border-radius: 2px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--pink-dk); }

    .login-error {
      color: #d93025;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fff0ef;
      border-left: 3px solid #d93025;
      border-radius: 1px;
    }

    .login-footer {
      padding: 16px 40px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </div>
      <div class="login-header-text">
        <h1>Social Media Ultimate Scraper</h1>
        <p>Secure Access Portal</p>
      </div>
    </div>
    <div class="login-body">
      <!--ERROR-->
      <form method="POST" action="/login" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
    <div class="login-footer">Restricted Access — Authorized Personnel Only</div>
  </div>
</body>
</html>
